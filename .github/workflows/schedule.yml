# This workflow will scrap GitHub trending projects daily.
name: Daily Github Trending

on:
  push:
    branches:
      - master
  schedule:
    - cron: "30 1 * * *"


jobs:
  build:

    runs-on: ubuntu-latest
    env:
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN}}
      GH_TOKEN: ${{ secrets.GH_TOKEN}}
      TELEGRAPH_TOKEN: ${{ secrets.TELEGRAPH_TOKEN }}
    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Set up Python 3.8
      uses: actions/setup-python@v2
      with:
        python-version: 3.8

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Scraper
      run: |
        python main.py

    - name: Check for changes
      id: git-status
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo ">>> 检测到文件变更, 需要提交推送"
        else
          echo ">>> 无文件变更, 跳过推送"
        fi

    # Runs a set of commands using the runners shell
    - name: Push to origin master
      if: steps.git-status.outputs.changed == 'true'
      run: |
        echo start push
        git config --global user.name "fireinrain"
        git config --global user.email "lzyme.dev@gmail.com"

        git add -A
        git commit -m $(date '+%Y-%m-%d')
        git pull --rebase origin master
        git push
